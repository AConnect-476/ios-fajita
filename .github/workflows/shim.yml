name: fajita-shim

on:
  workflow_dispatch:
  push:
    branches: [wcn3990-sdm845-port]
    paths:
      - "tools/build-fajita.sh"
      - "tools/mkadt.py"
      - "tools/mkpayload.py"
      - "shim/**"
      - "dtb/**"

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Find latest successful XNU build for this branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=${GITHUB_REF_NAME}&per_page=100")
          run_id=$(echo "$runs" | jq -r '[.workflow_runs[] | select(.name == "xnu" and .conclusion == "success")][0].id // empty')
          run_sha=$(echo "$runs" | jq -r '[.workflow_runs[] | select(.name == "xnu" and .conclusion == "success")][0].head_sha // empty')
          if [ -z "$run_id" ]; then
            echo "::error::No successful XNU build exists for this branch yet."
            exit 1
          fi
          echo "Using XNU run $run_id at $run_sha"
          git merge-base --is-ancestor "$run_sha" HEAD
          changed=$(git diff --name-only "$run_sha" HEAD)
          if echo "$changed" | grep -E '^(xnu/patches/|tools/mkadt.py$|tools/mkpayload.py$|tools/build-fajita.sh$|shim/|dtb/)'; then
            echo "::error::The successful XNU artifact is stale for the current source tree."
            exit 1
          fi
          echo "XNU_RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "XNU_RUN_SHA=$run_sha" >> "$GITHUB_ENV"

      - name: Download verified XNU kernel artifact
        uses: actions/download-artifact@v4
        with:
          name: xnu-kernel
          run-id: ${{ env.XNU_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: xnu/out

      - name: Verify XNU artifact
        run: |
          cd xnu/out
          sha256sum -c SHA256SUMS
          test -s kernel.development.sweet

      - name: Install ARM64 shim toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu cpio gzip python3 git jq

      - name: Install AOSP mkbootimg
        run: |
          git clone --depth 1 https://android.googlesource.com/platform/system/tools/mkbootimg /tmp/mkbootimg
          printf '#!/bin/sh\nexec python3 /tmp/mkbootimg/mkbootimg.py "$@"\n' | sudo tee /usr/local/bin/mkbootimg >/dev/null
          sudo chmod +x /usr/local/bin/mkbootimg
          mkbootimg --help >/dev/null

      - name: Build temporary boot image (no flashing)
        env:
          ADT_GAMUT: P3
          ARENA_MIB: "1"
          GPU_FW: /tmp/no-gmu-firmware-for-this-probe
        run: |
          mkdir -p "$HOME/gpu-fw"
          bash tools/build-fajita.sh
          test -s shim/out/shim-boot.img
          size=$(stat -c%s shim/out/shim-boot.img)
          echo "shim-boot.img size: $size bytes"
          if [ "$size" -gt 67108864 ]; then
            echo "::error::Boot image exceeds the 64 MiB boot_a backup size."
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          p = Path("shim/out/shim-boot.img")
          assert p.read_bytes()[:8] == b"ANDROID!", "bad Android boot image magic"
          print("Android boot image magic verified.")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: fajita-shim-boot
          path: |
            shim/out/shim-boot.img
            shim/out/payload.bin
            shim/out/fajita.adt
          retention-days: 7
